# Tour stops the robot will visit. Coordinates are in the `map` frame
# produced by slam_toolbox / Nav2 against maps/repf_b4_map.yaml.
#
#   id           - integer; passed to /tour/drop_poi to skip dynamically
#   name         - displayed in logs and in the tour plan
#   x, y, yaw    - target pose in metres / radians
#   landmark_id  - matching ArUco ID; sighting this marker within
#                  `landmark_arrival_distance_m` counts as arrival.
#   description  - fallback narration if no landmark is sighted at this stop.

pois:
  - id: 1
    name: "Gallogly Hall"
    x: -1.607
    y: 1.460
    yaw: 0.0
    landmark_id: 1
    description: >
      Gallogly Hall, a modern hub for engineering education at OU.

  - id: 2
    name: "Sarkeys Energy Center"
    x: -1.408
    y: -0.317
    yaw: 0.0
    landmark_id: 2
    description: >
      Sarkeys Energy Center, supporting research in energy and geology.

  - id: 3
    name: "Devon Energy Hall"
    x: -3.605
    y: 1.388
    yaw: 0.0
    landmark_id: 3
    description: >
      Devon Energy Hall, home to advanced engineering classrooms and labs.

  - id: 4
